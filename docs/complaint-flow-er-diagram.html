<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ER Diagram — Complaint Flow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      background: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh
    }

    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: linear-gradient(135deg, #1a2744, #2a4a7f);
      color: #fff;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 18px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px)
    }

    #header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .4px
    }

    #header .subtitle {
      font-size: 11.5px;
      opacity: .7;
      margin-top: 2px
    }

    #dlBtn {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, .3);
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all .2s
    }

    #dlBtn:hover {
      background: rgba(255, 255, 255, .25);
      border-color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2)
    }

    #controls {
      position: fixed;
      top: 80px;
      right: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    #controls button {
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: all .18s;
      font-family: inherit
    }

    #controls button:hover {
      background: rgba(255, 255, 255, .2);
      border-color: rgba(255, 255, 255, .4)
    }

    svg {
      cursor: grab
    }

    svg:active {
      cursor: grabbing
    }
  </style>
</head>

<body>
  <div id="header">
    <div>
      <h1>📋 ER Diagram — Complaint Flow</h1>
      <div class="subtitle">Smart City Resource Allocation System — Complaint Management Pipeline</div>
    </div>
    <button id="dlBtn" onclick="downloadPNG()">📥 Download PNG</button>
  </div>
  <div id="controls">
    <button onclick="zoomIn()" title="Zoom In">+</button>
    <button onclick="zoomOut()" title="Zoom Out">−</button>
    <button onclick="resetView()" title="Reset">⟲</button>
  </div>
  <svg id="canvas" width="100%" height="100%"></svg>

  <script>
    const svg = document.getElementById('canvas');
    const ns = 'http://www.w3.org/2000/svg';
    let baseVB = null;

    // ========== PAN / ZOOM ==========
    let vb = { x: 0, y: 0, w: 2000, h: 1500 }, drag = false, sp = null;
    function updVB() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
    svg.onmousedown = e => { drag = true; sp = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }; svg.style.cursor = 'grabbing' };
    svg.onmousemove = e => { if (!drag) return; const s = vb.w / svg.clientWidth; vb.x = sp.vx - (e.clientX - sp.x) * s; vb.y = sp.vy - (e.clientY - sp.y) * s; updVB() };
    svg.onmouseup = svg.onmouseleave = () => { drag = false; svg.style.cursor = 'grab' };
    svg.onwheel = e => { e.preventDefault(); const f = e.deltaY > 0 ? 1.08 : .92, r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width, my = (e.clientY - r.top) / r.height, nw = vb.w * f, nh = vb.h * f; vb.x += (vb.w - nw) * mx; vb.y += (vb.h - nh) * my; vb.w = nw; vb.h = nh; updVB() };
    function zoomIn() { const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2; vb.w *= .8; vb.h *= .8; vb.x = cx - vb.w / 2; vb.y = cy - vb.h / 2; updVB() }
    function zoomOut() { const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2; vb.w *= 1.25; vb.h *= 1.25; vb.x = cx - vb.w / 2; vb.y = cy - vb.h / 2; updVB() }
    function resetView() { if (baseVB) vb = { ...baseVB }; updVB() }

    // ========== SVG HELPERS ==========
    function $(tag, a) { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(a || {})) e.setAttribute(k, v); return e }

    function addDefs() {
      const defs = $('defs', {});
      // Entity glow
      const f1 = $('filter', { id: 'entityGlow', x: '-20%', y: '-20%', width: '140%', height: '140%' });
      const gb1 = $('feGaussianBlur', { stdDeviation: '4', result: 'glow' });
      const fm1 = $('feMerge', {}); fm1.appendChild($('feMergeNode', { in: 'glow' })); fm1.appendChild($('feMergeNode', { in: 'SourceGraphic' }));
      f1.appendChild(gb1); f1.appendChild(fm1); defs.appendChild(f1);
      // Diamond glow
      const f2 = $('filter', { id: 'diamondGlow', x: '-30%', y: '-30%', width: '160%', height: '160%' });
      const gb2 = $('feGaussianBlur', { stdDeviation: '5', result: 'glow' });
      const fm2 = $('feMerge', {}); fm2.appendChild($('feMergeNode', { in: 'glow' })); fm2.appendChild($('feMergeNode', { in: 'SourceGraphic' }));
      f2.appendChild(gb2); f2.appendChild(fm2); defs.appendChild(f2);
      svg.appendChild(defs);
    }

    function path(pts, color, sw) {
      const d = pts.map((p, i) => (i ? 'L ' : 'M ') + p[0] + ' ' + p[1]).join(' ');
      svg.appendChild($('path', { d, fill: 'none', stroke: color || '#4a90d9', 'stroke-width': sw || 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    }

    function diamond(cx, cy, label, hw, hh) {
      hw = hw || 68; hh = hh || 36; const g = $('g', {});
      g.appendChild($('polygon', { points: `${cx + 2},${cy - hh + 2} ${cx + hw + 2},${cy + 2} ${cx + 2},${cy + hh + 2} ${cx - hw + 2},${cy + 2}`, fill: 'rgba(0,0,0,.3)' }));
      g.appendChild($('polygon', { points: `${cx},${cy - hh} ${cx + hw},${cy} ${cx},${cy + hh} ${cx - hw},${cy}`, fill: '#e67e22', stroke: '#d35400', 'stroke-width': 2.5, filter: 'url(#diamondGlow)' }));
      const t = $('text', { x: cx, y: cy, 'font-family': "'Segoe UI',system-ui", 'font-size': '11.5px', 'font-weight': '700', fill: '#fff', 'text-anchor': 'middle', 'dominant-baseline': 'central' });
      if (label.includes('\n')) { label.split('\n').forEach((l, i) => { const s = $('tspan', { x: cx, dy: i ? '13px' : `${-(label.split('\n').length - 1) * 6}px` }); s.textContent = l; t.appendChild(s) }) }
      else t.textContent = label;
      g.appendChild(t); svg.appendChild(g);
    }

    function card(x, y, label) {
      const t = $('text', { x, y, 'font-family': "'Segoe UI',system-ui", 'font-size': '15px', 'font-weight': '800', fill: '#e74c3c', 'text-anchor': 'middle', 'dominant-baseline': 'central' });
      t.textContent = label; svg.appendChild(t);
    }

    function entity(x, y, w, h, label, color) {
      const g = $('g', {});
      g.appendChild($('rect', { x: x + 3, y: y + 3, width: w, height: h, fill: 'rgba(0,0,0,.3)', rx: 8 }));
      g.appendChild($('rect', { x, y, width: w, height: h, fill: color || '#2980b9', stroke: '#1a5276', rx: 8, 'stroke-width': 2.5, filter: 'url(#entityGlow)' }));
      const t = $('text', { x: x + w / 2, y: y + h / 2, 'font-family': "'Segoe UI',system-ui", 'font-size': '15px', 'font-weight': '700', fill: '#fff', 'text-anchor': 'middle', 'dominant-baseline': 'central', 'letter-spacing': '0.5' });
      if (label.includes('\n')) { label.split('\n').forEach((l, i) => { const s = $('tspan', { x: x + w / 2, dy: i ? '17px' : `${-(label.split('\n').length - 1) * 8}px` }); s.textContent = l; t.appendChild(s) }) }
      else t.textContent = label;
      g.appendChild(t); svg.appendChild(g);
    }

    function oval(ax, ay, name, pk) {
      const g = $('g', {});
      if (pk) {
        g.appendChild($('ellipse', { cx: ax, cy: ay, rx: 56, ry: 18, fill: '#1a3652', stroke: '#3498db', 'stroke-width': 2.5 }));
        g.appendChild($('ellipse', { cx: ax, cy: ay, rx: 48, ry: 13, fill: '#1a3652', stroke: '#3498db', 'stroke-width': 1.5 }));
      } else {
        g.appendChild($('ellipse', { cx: ax, cy: ay, rx: 56, ry: 18, fill: '#152a3e', stroke: '#2980b9', 'stroke-width': 1.8 }));
      }
      const t = $('text', { x: ax, y: ay, 'font-family': "'Segoe UI',system-ui", 'font-size': pk ? '11px' : '10.5px', 'font-weight': pk ? '700' : '500', 'text-decoration': pk ? 'underline' : 'none', 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: pk ? '#5dade2' : '#85c1e9' });
      t.textContent = name; g.appendChild(t); svg.appendChild(g);
    }

    function attrH(ecx, ecy, ax, ay, name, pk) { path([[ecx, ecy], [ax, ecy], [ax, ay]], '#2c5f88', 2); oval(ax, ay, name, pk) }
    function attrV(ecx, ecy, ax, ay, name, pk) { path([[ecx, ecy], [ecx, ay], [ax, ay]], '#2c5f88', 2); oval(ax, ay, name, pk) }

    function rowAttrs(ecx, ecy, attrs, yOff, spacing) {
      const n = attrs.length, tot = (n - 1) * spacing;
      attrs.forEach((a, i) => { const ax = ecx - tot / 2 + i * spacing; attrH(ecx, ecy, ax, ecy + yOff, a.n, a.pk) });
    }

    function colAttrs(ecx, ecy, attrs, xOff, spacing) {
      const n = attrs.length, tot = (n - 1) * spacing;
      attrs.forEach((a, i) => { const ay = ecy - tot / 2 + i * spacing; attrV(ecx, ecy, ecx + xOff, ay, a.n, a.pk) });
    }

    function svgTitle(w, title, sub) {
      svg.appendChild($('rect', { x: 0, y: 0, width: w, height: 58, fill: '#1a2744' }));
      svg.appendChild($('rect', { x: 0, y: 56, width: w, height: 2, fill: '#3498db', opacity: '0.5' }));
      const t = $('text', { x: w / 2, y: 21, 'font-family': "'Segoe UI',system-ui", 'font-size': '18px', 'font-weight': '700', fill: '#fff', 'text-anchor': 'middle', 'dominant-baseline': 'central' });
      t.textContent = '📋 ' + title; svg.appendChild(t);
      if (sub) { const s = $('text', { x: w / 2, y: 43, 'font-family': "'Segoe UI',system-ui", 'font-size': '12px', fill: 'rgba(255,255,255,.6)', 'text-anchor': 'middle', 'dominant-baseline': 'central' }); s.textContent = sub; svg.appendChild(s) }
    }

    function svgLegend(lx, ly) {
      svg.appendChild($('rect', { x: lx, y: ly, width: 255, height: 165, fill: 'rgba(20,35,55,.92)', stroke: 'rgba(52,152,219,.3)', 'stroke-width': 1.5, rx: 10 }));
      const items = [
        { ty: 'r', fill: '#2980b9', lbl: 'Entity (Rectangle)', dy: 0 },
        { ty: 'o', fill: '#152a3e', s: '#2980b9', lbl: 'Attribute (Oval)', dy: 26 },
        { ty: 'd', fill: '#1a3652', s: '#3498db', lbl: 'Primary Key (Double Oval)', dy: 52 },
        { ty: 'dm', fill: '#e67e22', lbl: 'Relationship (Diamond)', dy: 78 },
        { ty: 'c', lbl: '1, N — Cardinality', dy: 104 }
      ];
      const tx = $('text', { x: lx + 12, y: ly + 20, 'font-family': "'Segoe UI'", 'font-size': '13px', 'font-weight': '700', fill: '#3498db', 'dominant-baseline': 'central' });
      tx.textContent = 'LEGEND'; svg.appendChild(tx);
      items.forEach(it => {
        const iy = ly + 42 + it.dy;
        if (it.ty === 'r') svg.appendChild($('rect', { x: lx + 12, y: iy - 7, width: 24, height: 14, fill: it.fill, rx: 3 }));
        else if (it.ty === 'o') svg.appendChild($('ellipse', { cx: lx + 24, cy: iy, rx: 13, ry: 7, fill: it.fill, stroke: it.s, 'stroke-width': 1.5 }));
        else if (it.ty === 'd') { svg.appendChild($('ellipse', { cx: lx + 24, cy: iy, rx: 14, ry: 8, fill: it.fill, stroke: it.s, 'stroke-width': 2 })); svg.appendChild($('ellipse', { cx: lx + 24, cy: iy, rx: 10, ry: 5, fill: it.fill, stroke: it.s, 'stroke-width': 1 })) }
        else if (it.ty === 'dm') { const dx = lx + 24, dy = iy; svg.appendChild($('polygon', { points: `${dx},${dy - 8} ${dx + 10},${dy} ${dx},${dy + 8} ${dx - 10},${dy}`, fill: it.fill })) }
        else if (it.ty === 'c') { const ct = $('text', { x: lx + 12, y: iy, 'font-family': "'Segoe UI'", 'font-size': '14px', 'font-weight': '700', fill: '#e74c3c', 'dominant-baseline': 'central' }); ct.textContent = '1, N'; svg.appendChild(ct) }
        const lt = $('text', { x: lx + 46, y: iy, 'font-family': "'Segoe UI'", 'font-size': '11px', fill: 'rgba(255,255,255,.7)', 'dominant-baseline': 'central' });
        lt.textContent = it.lbl; svg.appendChild(lt);
      });
    }

    // ========== COMPLAINT FLOW DIAGRAM ==========
    function drawComplaintFlow() {
      svg.innerHTML = '';
      baseVB = vb = { x: 0, y: 0, w: 2000, h: 1500 }; updVB();
      addDefs();
      svgTitle(2000, 'Complaint Flow — ER Diagram', 'USER creates REQUEST at LOCATION · Actions tracked via ACTION_LOG & ADMIN_ACTIVITY_LOG');

      // ========================
      //          LAYOUT
      // ========================
      //
      //   ACTION_LOG (350, 350)                              USER (1000, 300)                        ADMIN_ACTIVITY_LOG (1650, 350)
      //        |attrs below                        attrs above  |  |                                          |attrs below
      //        |                      PERFORMS◇----(left)  CREATES◇  ◇ASSIGNED_TO  ----(right)◇RECORDS        |
      //        |                                            |         |                                       |
      //        |                                            REQUEST (1000, 700)
      //        |                                     attrs left  |  attrs right
      //        |                                             HAS ◇
      //        |                                               |
      //        |                                          LOCATION (1000, 1100)
      //        |                                            attrs below

      // Entity positions (center of each entity)
      const UX = 1000, UY = 300;     // USER
      const RX = 1000, RY = 710;     // REQUEST
      const LX = 1000, LY = 1100;    // LOCATION
      const AX = 300, AY = 350;     // ACTION_LOG
      const ADX = 1700, ADY = 350;    // ADMIN_ACTIVITY_LOG

      // ============ RELATIONSHIPS ============

      // 1) USER --CREATES--> REQUEST (vertical line at x=940)
      path([[940, UY + 25], [940, 478 - 36]], '#e67e22', 3);
      path([[940, 478 + 36], [940, RY - 25]], '#e67e22', 3);
      diamond(940, 478, 'CREATES');
      card(916, UY + 55, '1'); card(916, RY - 55, 'N');

      // 2) USER --ASSIGNED_TO--> REQUEST (vertical line at x=1060)
      path([[1060, UY + 25], [1060, 478 - 36]], '#e67e22', 3);
      path([[1060, 478 + 36], [1060, RY - 25]], '#e67e22', 3);
      diamond(1060, 478, 'ASSIGNED\nTO');
      card(1088, UY + 55, '1'); card(1088, RY - 55, 'N');

      // 3) REQUEST --HAS--> LOCATION (vertical line at x=1000)
      path([[1000, RY + 25], [1000, 894 - 36]], '#e67e22', 3);
      path([[1000, 894 + 36], [1000, LY - 25]], '#e67e22', 3);
      diamond(1000, 894, 'HAS');
      card(976, RY + 55, 'N'); card(976, LY - 55, '1');

      // 4) USER --PERFORMS--> ACTION_LOG (horizontal route)
      // From USER left → horizontal → down to ACTION_LOG
      path([[UX - 75, UY], [690, UY], [690, AY], [AX + 80, AY]], '#e67e22', 3);
      diamond(690, 340, 'PERFORMS', 60, 32);
      card(UX - 90, UY - 20, '1'); card(AX + 95, AY - 20, 'N');

      // 5) USER --RECORDS--> ADMIN_ACTIVITY_LOG (horizontal route)
      // From USER right → horizontal → down to ADMIN_ACTIVITY_LOG
      path([[UX + 75, UY], [1310, UY], [1310, ADY], [ADX - 95, ADY]], '#e67e22', 3);
      diamond(1310, 340, 'RECORDS', 60, 32);
      card(UX + 90, UY - 20, '1'); card(ADX - 112, ADY - 20, 'N');

      // ============ ENTITIES ============
      entity(UX - 75, UY - 25, 150, 50, 'USER', '#2980b9');
      entity(RX - 80, RY - 25, 160, 50, 'REQUEST', '#27ae60');
      entity(LX - 80, LY - 25, 160, 50, 'LOCATION', '#8e44ad');
      entity(AX - 80, AY - 28, 160, 56, 'ACTION\nLOG', '#c0392b');
      entity(ADX - 95, ADY - 28, 190, 56, 'ADMIN\nACTIVITY LOG', '#d35400');

      // ============ ATTRIBUTES ============

      // USER — spread above the entity
      rowAttrs(UX, UY, [
        { n: 'id', pk: 1 }, { n: 'name' }, { n: 'email' }, { n: 'role' }, { n: 'is_active' }
      ], -90, 125);

      // REQUEST — two columns: left and right
      colAttrs(RX, RY, [
        { n: 'id', pk: 1 },
        { n: 'user_id' },
        { n: 'location_id' },
        { n: 'assigned_to' },
        { n: 'complaint_category' },
        { n: 'description' },
        { n: 'image' }
      ], -230, 42);

      colAttrs(RX, RY, [
        { n: 'priority' },
        { n: 'status' },
        { n: 'operator_remark' },
        { n: 'requested_at' },
        { n: 'assigned_at' },
        { n: 'started_at' },
        { n: 'resolved_at' }
      ], 230, 42);

      // LOCATION — spread below the entity
      rowAttrs(LX, LY, [
        { n: 'id', pk: 1 }, { n: 'zone_name' }, { n: 'zone_code' }, { n: 'latitude' }, { n: 'longitude' }, { n: 'is_active' }
      ], 85, 125);

      // ACTION_LOG — spread below the entity
      rowAttrs(AX, AY, [
        { n: 'id', pk: 1 }, { n: 'entity_type' }, { n: 'entity_id' }, { n: 'action' }, { n: 'actor_id' }
      ], 95, 115);

      // ADMIN_ACTIVITY_LOG — spread below the entity
      rowAttrs(ADX, ADY, [
        { n: 'id', pk: 1 }, { n: 'admin_id' }, { n: 'action_type' }, { n: 'entity_type' }, { n: 'entity_id' }
      ], 95, 115);

      // Legend
      svgLegend(15, 1310);
    }

    // ========== DOWNLOAD PNG ==========
    function downloadPNG() {
      const clone = svg.cloneNode(true);
      const v = svg.getAttribute('viewBox').split(' ').map(Number);
      const scale = 2;
      const w = v[2] * scale, h = v[3] * scale;

      clone.setAttribute('width', w);
      clone.setAttribute('height', h);
      clone.setAttribute('xmlns', ns);

      // ---- Recolor clone for white background ----
      // Add white background rect as first child
      const bgRect = document.createElementNS(ns, 'rect');
      bgRect.setAttribute('x', v[0]);
      bgRect.setAttribute('y', v[1]);
      bgRect.setAttribute('width', v[2]);
      bgRect.setAttribute('height', v[3]);
      bgRect.setAttribute('fill', '#ffffff');
      clone.insertBefore(bgRect, clone.firstChild);

      // Recolor attribute ovals: dark fills + dark text for readability
      clone.querySelectorAll('ellipse').forEach(el => {
        const fill = el.getAttribute('fill');
        if (fill === '#1a3652' || fill === '#152a3e') {
          el.setAttribute('fill', '#eaf2fb');
        }
      });

      // Recolor oval text to dark
      clone.querySelectorAll('text').forEach(t => {
        const fill = t.getAttribute('fill');
        if (fill === '#5dade2' || fill === '#85c1e9') {
          t.setAttribute('fill', '#1a3a50');
        }
        // Legend item labels
        if (fill === 'rgba(255,255,255,.7)') {
          t.setAttribute('fill', '#333');
        }
        // SVG subtitle text
        if (fill === 'rgba(255,255,255,.6)') {
          t.setAttribute('fill', 'rgba(255,255,255,.85)');
        }
      });

      // Recolor legend background
      clone.querySelectorAll('rect').forEach(r => {
        const fill = r.getAttribute('fill');
        if (fill === 'rgba(20,35,55,.92)') {
          r.setAttribute('fill', '#f0f4f8');
          r.setAttribute('stroke', '#bbb');
        }
      });

      // Recolor connector lines to darker shade
      clone.querySelectorAll('path').forEach(p => {
        const stroke = p.getAttribute('stroke');
        if (stroke === '#2c5f88') {
          p.setAttribute('stroke', '#5a8ab5');
        }
      });

      const data = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const a = document.createElement('a');
        a.download = 'ER_Diagram_Complaint_Flow.png';
        a.href = c.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    // ========== INIT ==========
    drawComplaintFlow();
  </script>
</body>

</html>
