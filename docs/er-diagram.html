<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ER Diagram — Smart City Resource Allocation System</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI','Inter',system-ui,sans-serif;background:#eef2f7;overflow:hidden;width:100vw;height:100vh}
    #header{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#1a5c4c,#2d8a6e);color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.18)}
    #header h1{font-size:16px;font-weight:700;letter-spacing:.3px}
    #tabs{display:flex;gap:4px;margin-top:6px}
    .tab{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:6px 14px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit;white-space:nowrap}
    .tab:hover{background:rgba(255,255,255,.28)}
    .tab.active{background:#fff;color:#1a5c4c;border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
    #dlBtn{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .18s}
    #dlBtn:hover{background:rgba(255,255,255,.3);border-color:#fff}
    #controls{position:fixed;top:82px;right:14px;z-index:100;display:flex;flex-direction:column;gap:5px}
    #controls button{background:#fff;border:1px solid #d0d8e0;border-radius:7px;width:34px;height:34px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.07);transition:all .15s;font-family:inherit}
    #controls button:hover{background:#e8f5f0;border-color:#2d8a6e}
    svg{cursor:grab}svg:active{cursor:grabbing}
  </style>
</head>
<body>
  <div id="header">
    <div>
      <h1>📊 ER Diagram — Smart City Resource Allocation System</h1>
      <div id="tabs">
        <button class="tab active" onclick="switchModule(1)">1️⃣ User & Request</button>
        <button class="tab" onclick="switchModule(2)">2️⃣ Resource Allocation</button>
        <button class="tab" onclick="switchModule(3)">3️⃣ Provider & Services</button>
        <button class="tab" onclick="switchModule(4)">4️⃣ Logs & Monitoring</button>
      </div>
    </div>
    <button id="dlBtn" onclick="downloadPNG()">📥 Download PNG</button>
  </div>
  <div id="controls">
    <button onclick="zoomIn()" title="Zoom In">+</button>
    <button onclick="zoomOut()" title="Zoom Out">−</button>
    <button onclick="resetView()" title="Reset">⟲</button>
  </div>
  <svg id="canvas" width="100%" height="100%"></svg>

<script>
const svg = document.getElementById('canvas');
const ns = 'http://www.w3.org/2000/svg';
let currentModule = 1, baseVB = null;

// ========== PAN / ZOOM ==========
let vb = {x:0,y:0,w:1600,h:1300}, drag=false, sp=null;
function updVB(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
svg.onmousedown=e=>{drag=true;sp={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.style.cursor='grabbing'};
svg.onmousemove=e=>{if(!drag)return;const s=vb.w/svg.clientWidth;vb.x=sp.vx-(e.clientX-sp.x)*s;vb.y=sp.vy-(e.clientY-sp.y)*s;updVB()};
svg.onmouseup=svg.onmouseleave=()=>{drag=false;svg.style.cursor='grab'};
svg.onwheel=e=>{e.preventDefault();const f=e.deltaY>0?1.08:.92,r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height,nw=vb.w*f,nh=vb.h*f;vb.x+=(vb.w-nw)*mx;vb.y+=(vb.h-nh)*my;vb.w=nw;vb.h=nh;updVB()};
function zoomIn(){const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w*=.8;vb.h*=.8;vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;updVB()}
function zoomOut(){const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w*=1.25;vb.h*=1.25;vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;updVB()}
function resetView(){if(baseVB)vb={...baseVB};updVB()}

// ========== SVG HELPERS ==========
function $(tag,a){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,v);return e}
function path(pts,color,sw){const d=pts.map((p,i)=>(i?'L ':'M ')+p[0]+' '+p[1]).join(' ');svg.appendChild($('path',{d,fill:'none',stroke:color||'#4a8a7a','stroke-width':sw||2.5,'stroke-linejoin':'round','stroke-linecap':'round'}))}

function diamond(cx,cy,label,hw,hh){
  hw=hw||62;hh=hh||34;const g=$('g',{});
  g.appendChild($('polygon',{points:`${cx+2},${cy-hh+2} ${cx+hw+2},${cy+2} ${cx+2},${cy+hh+2} ${cx-hw+2},${cy+2}`,fill:'rgba(0,0,0,.1)'}));
  g.appendChild($('polygon',{points:`${cx},${cy-hh} ${cx+hw},${cy} ${cx},${cy+hh} ${cx-hw},${cy}`,fill:'#e8870e',stroke:'#b8650a','stroke-width':2.5}));
  const t=$('text',{x:cx,y:cy,'font-family':"'Segoe UI',system-ui",'font-size':'11.5px','font-weight':'700',fill:'#fff','text-anchor':'middle','dominant-baseline':'central'});
  if(label.includes('\n')){label.split('\n').forEach((l,i)=>{const s=$('tspan',{x:cx,dy:i?'13px':`${-(label.split('\n').length-1)*6}px`});s.textContent=l;t.appendChild(s)})}
  else t.textContent=label;
  g.appendChild(t);svg.appendChild(g);
}

function card(x,y,label){
  const t=$('text',{x,y,'font-family':"'Segoe UI',system-ui",'font-size':'16px','font-weight':'800',fill:'#c0392b','text-anchor':'middle','dominant-baseline':'central'});
  t.textContent=label;svg.appendChild(t);
}

function entity(x,y,w,h,label,color){
  const g=$('g',{});
  g.appendChild($('rect',{x:x+3,y:y+3,width:w,height:h,fill:'rgba(0,0,0,.12)',rx:7}));
  g.appendChild($('rect',{x,y,width:w,height:h,fill:color||'#1a7a5a',stroke:'#0d4a3a',rx:7,'stroke-width':2.8}));
  const t=$('text',{x:x+w/2,y:y+h/2,'font-family':"'Segoe UI',system-ui",'font-size':'15px','font-weight':'700',fill:'#fff','text-anchor':'middle','dominant-baseline':'central'});
  if(label.includes('\n')){label.split('\n').forEach((l,i)=>{const s=$('tspan',{x:x+w/2,dy:i?'16px':`${-(label.split('\n').length-1)*7}px`});s.textContent=l;t.appendChild(s)})}
  else t.textContent=label;
  g.appendChild(t);svg.appendChild(g);
}

function oval(ax,ay,name,pk){
  const g=$('g',{});
  if(pk){
    g.appendChild($('ellipse',{cx:ax,cy:ay,rx:54,ry:18,fill:'#d4edda',stroke:'#0d5a3c','stroke-width':2.8}));
    g.appendChild($('ellipse',{cx:ax,cy:ay,rx:46,ry:13,fill:'#d4edda',stroke:'#0d5a3c','stroke-width':1.5}));
  } else {
    g.appendChild($('ellipse',{cx:ax,cy:ay,rx:54,ry:18,fill:'#b8edd8',stroke:'#2d8a6e','stroke-width':2}));
  }
  const t=$('text',{x:ax,y:ay,'font-family':"'Segoe UI',system-ui",'font-size':pk?'11px':'10.5px','font-weight':pk?'700':'400','text-decoration':pk?'underline':'none','text-anchor':'middle','dominant-baseline':'central',fill:'#1a3a30'});
  t.textContent=name;g.appendChild(t);svg.appendChild(g);
}

// Attribute placement with orthogonal lines
function attrH(ecx,ecy,ax,ay,name,pk){path([[ecx,ecy],[ax,ecy],[ax,ay]],'#4a8a7a',2.5);oval(ax,ay,name,pk)}
function attrV(ecx,ecy,ax,ay,name,pk){path([[ecx,ecy],[ecx,ay],[ax,ay]],'#4a8a7a',2.5);oval(ax,ay,name,pk)}

// Place attrs in a horizontal row above/below entity
function rowAttrs(ecx,ecy,attrs,yOff,spacing){
  const n=attrs.length,tot=(n-1)*spacing;
  attrs.forEach((a,i)=>{const ax=ecx-tot/2+i*spacing;attrH(ecx,ecy,ax,ecy+yOff,a.n,a.pk)});
}

// Place attrs in a vertical column left/right of entity
function colAttrs(ecx,ecy,attrs,xOff,spacing){
  const n=attrs.length,tot=(n-1)*spacing;
  attrs.forEach((a,i)=>{const ay=ecy-tot/2+i*spacing;attrV(ecx,ecy,ecx+xOff,ay,a.n,a.pk)});
}

// Title bar inside SVG (appears in PNG)
function svgTitle(w,title,sub){
  svg.appendChild($('rect',{x:0,y:0,width:w,height:56,fill:'#1a5c4c'}));
  const t=$('text',{x:w/2,y:20,'font-family':"'Segoe UI',system-ui",'font-size':'18px','font-weight':'700',fill:'#fff','text-anchor':'middle','dominant-baseline':'central'});
  t.textContent='📊 '+title;svg.appendChild(t);
  if(sub){const s=$('text',{x:w/2,y:42,'font-family':"'Segoe UI',system-ui",'font-size':'12px',fill:'rgba(255,255,255,.8)','text-anchor':'middle','dominant-baseline':'central'});s.textContent=sub;svg.appendChild(s)}
}

// In-SVG legend (for PNG)
function svgLegend(lx,ly){
  svg.appendChild($('rect',{x:lx,y:ly,width:245,height:155,fill:'rgba(255,255,255,.94)',stroke:'#d0d8e0','stroke-width':1,rx:8}));
  const items=[
    {ty:'r',fill:'#1a7a5a',lbl:'Entity (Rectangle)',dy:0},
    {ty:'o',fill:'#b8edd8',s:'#2d8a6e',lbl:'Attribute (Oval)',dy:26},
    {ty:'d',fill:'#d4edda',s:'#0d5a3c',lbl:'Primary Key (Double Oval)',dy:52},
    {ty:'dm',fill:'#e8870e',lbl:'Relationship (Diamond)',dy:78},
    {ty:'c',lbl:'1, N — Cardinality',dy:104}
  ];
  const tx=$('text',{x:lx+10,y:ly+18,'font-family':"'Segoe UI'",'font-size':'13px','font-weight':'700',fill:'#1a5c4c','dominant-baseline':'central'});
  tx.textContent='LEGEND';svg.appendChild(tx);
  items.forEach(it=>{
    const iy=ly+38+it.dy;
    if(it.ty==='r')svg.appendChild($('rect',{x:lx+10,y:iy-7,width:24,height:14,fill:it.fill,rx:3}));
    else if(it.ty==='o')svg.appendChild($('ellipse',{cx:lx+22,cy:iy,rx:13,ry:7,fill:it.fill,stroke:it.s,'stroke-width':1.5}));
    else if(it.ty==='d'){svg.appendChild($('ellipse',{cx:lx+22,cy:iy,rx:14,ry:8,fill:it.fill,stroke:it.s,'stroke-width':2}));svg.appendChild($('ellipse',{cx:lx+22,cy:iy,rx:10,ry:5,fill:it.fill,stroke:it.s,'stroke-width':1}))}
    else if(it.ty==='dm'){const dx=lx+22,dy=iy;svg.appendChild($('polygon',{points:`${dx},${dy-8} ${dx+10},${dy} ${dx},${dy+8} ${dx-10},${dy}`,fill:it.fill}))}
    else if(it.ty==='c'){const ct=$('text',{x:lx+10,y:iy,'font-family':"'Segoe UI'",'font-size':'14px','font-weight':'700',fill:'#c0392b','dominant-baseline':'central'});ct.textContent='1, N';svg.appendChild(ct)}
    const lt=$('text',{x:lx+42,y:iy,'font-family':"'Segoe UI'",'font-size':'11px',fill:'#444','dominant-baseline':'central'});
    lt.textContent=it.lbl;svg.appendChild(lt);
  });
}

// ========== MODULE 1: User & Request Flow ==========

  svg.innerHTML='';
  baseVB=vb={x:0,y:0,w:1600,h:1380};updVB();
  svgTitle(1600,'Module 1: User & Request Flow','Core System — USER creates REQUEST in LOCATION');

  // -- Relationships (draw first = behind) --
  // CREATES: vertical at x=700
  path([[700,280],[700,465-36]],'#d4760a',3.5);
  path([[700,465+36],[700,680]],'#d4760a',3.5);
  diamond(700,465,'CREATES');
  card(678,310,'1'); card(678,650,'N');

  // ASSIGNED TO: vertical at x=860
  path([[860,280],[860,465-36]],'#d4760a',3.5);
  path([[860,465+36],[860,680]],'#d4760a',3.5);
  diamond(860,465,'ASSIGNED\nTO');
  card(884,310,'1'); card(884,650,'N');

  // LOCATED IN: vertical at x=780
  path([[780,780],[780,950-36]],'#d4760a',3.5);
  path([[780,950+36],[780,1090]],'#d4760a',3.5);
  diamond(780,950,'LOCATED\nIN');
  card(756,810,'N'); card(756,1065,'1');

  // -- Entities --
  entity(710,230,140,50,'USER','#1a7a5a');
  entity(705,680,150,50,'REQUEST','#1a7a5a');
  entity(705,1090,150,50,'LOCATION','#1a7a5a');

  // -- Attributes --
  const ux=780,uy=255;
  rowAttrs(ux,uy,[{n:'id',pk:1},{n:'name'},{n:'email'},{n:'password_hash'},{n:'role'},{n:'status'}],-85,115);
  rowAttrs(ux,uy,[{n:'is_active'},{n:'auth_provider'},{n:'google_id'},{n:'max_active_comp'},{n:'last_assigned_at'},{n:'profile_photo'}],-155,115);

  colAttrs(rx,ry,[{n:'id',pk:1},{n:'complaint_cat'},{n:'priority'},{n:'status'},{n:'description'},{n:'qty_requested'},{n:'qty_fulfilled'}],-200,42);
  colAttrs(rx,ry,[{n:'requested_at'},{n:'assigned_at'},{n:'resolved_at'},{n:'slaBreached'},{n:'image'},{n:'assign_strategy'},{n:'assign_score'}],-330,42);

  rowAttrs(lx,ly,[{n:'id',pk:1},{n:'zone_name'},{n:'zone_code'},{n:'latitude'},{n:'longitude'}],80,115);

  svgLegend(10,1210);
}

// ========== TAB SWITCHING ==========
const moduleNames = {1:'User_Request_Flow',2:'Resource_Allocation_Flow',3:'Provider_Services',4:'Logs_Monitoring'};
const drawFns = {1:drawModule1,2:drawModule2,3:drawModule3,4:drawModule4};

function switchModule(n){
  currentModule=n;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));
  drawFns[n]();
}

// ========== DOWNLOAD PNG ==========
function downloadPNG(){
  const clone = svg.cloneNode(true);
  const v = svg.getAttribute('viewBox').split(' ').map(Number);
  const scale = 2;
  const w = v[2]*scale, h = v[3]*scale;

  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  clone.setAttribute('xmlns', ns);

  const data = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([data], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#eef2f7';
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    const a = document.createElement('a');
    a.download = `ER_Diagram_${moduleNames[currentModule]}.png`;
    a.href = c.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

// ========== INIT ==========
drawModule1();
</script>
</body>
